<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Remove Demo</title>
</head>
<body>
    <ul id="images">
        <li><img src="https://picsum.photos/id/1015/120/80" alt="img1"></li>
        <li><img src="https://picsum.photos/id/1016/120/80" alt="img2"></li>
        <li><img src="https://picsum.photos/id/1018/120/80" alt="img3"></li>
        <li><img src="https://picsum.photos/id/1019/120/80" alt="img4"></li>
        <li><img src="https://picsum.photos/id/1020/120/80" alt="img5"></li>
        <li><img src="https://picsum.photos/id/1021/120/80" alt="img6"></li>
        <li><img src="https://picsum.photos/id/1022/120/80" alt="img7"></li>
        <li><img src="https://picsum.photos/id/1023/120/80" alt="img8"></li>
        <li><img src="https://picsum.photos/id/1024/120/80" alt="img9"></li>
        <li><img src="https://picsum.photos/id/1025/120/80" alt="img10"></li>
    </ul>
    <script>
        document.querySelector('#images').addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG') { // Only remove if an image is clicked
                let removeIt = e.target.parentNode;
                removeIt.remove();
            }
        });
    </script>
</body>
</html>
